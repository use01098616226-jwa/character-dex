<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포켓 캐릭터 도감 & 멀티 카드 뷰어</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="logo-area">
      <span class="logo-badge">DEX</span>
      <h1>포켓 캐릭터 도감</h1>
      <span class="subtitle">캐릭터를 선택해 다양한 모습의 카드를 수집하고 뒤집어 보세요!</span>
    </div>
    <div class="header-actions">
      <button id="resetDataBtn" class="btn btn-outline" title="초기 샘플 데이터로 되돌립니다">기본 도감 초기화</button>
      <button id="openCharModalBtn" class="btn btn-primary">+ 새 캐릭터 등록</button>
    </div>
  </header>

  <!-- 메인 컨테이너 (좌측 캐릭터 목록 / 우측 선택 캐릭터 상세 및 다양한 모습 카드) -->
  <main class="dex-layout">
    <!-- 좌측: 등록된 캐릭터 리스트 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>등록된 캐릭터</h2>
        <span id="charCountBadge" class="count-badge">0</span>
      </div>
      <ul id="characterList" class="character-list">
        <!-- JS에서 캐릭터 목록 렌더링 -->
      </ul>
    </aside>

    <!-- 우측: 선택된 캐릭터 프로필 & 다양한 모습 카드 그리드 -->
    <section class="content-area">
      <!-- 선택된 캐릭터 배너 -->
      <div id="characterBanner" class="character-banner">
        <!-- JS에서 선택 캐릭터 상세 정보 렌더링 -->
      </div>

      <!-- 컨트롤 바: 모습 태그 필터 & 새 모습 카드 추가 버튼 -->
      <div class="card-controls">
        <div id="tagFilterGroup" class="tag-filter-group">
          <button class="filter-chip active" data-tag="ALL">전체 모습</button>
          <button class="filter-chip" data-tag="일상">일상</button>
          <button class="filter-chip" data-tag="스페셜">스페셜</button>
          <button class="filter-chip" data-tag="토벌/액션">토벌/액션</button>
          <button class="filter-chip" data-tag="먹방">먹방</button>
        </div>
        <button id="openVariantModalBtn" class="btn btn-accent">+ 이 캐릭터의 새로운 모습 추가</button>
      </div>

      <p class="flip-guide">💡 카드를 <strong>클릭</strong>하면 뒷면의 명대사와 비하인드 메모를 볼 수 있습니다.</p>

      <!-- 다양한 모습 카드 그리드 -->
      <div id="variantCardGrid" class="variant-grid">
        <!-- JS에서 선택 캐릭터의 모습 카드들 렌더링 -->
      </div>
    </section>
  </main>

  <!-- 모달 1: 새 캐릭터 등록 -->
  <div id="charModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>새로운 캐릭터 도감 등록</h3>
        <button class="close-btn" data-close="charModal">&times;</button>
      </div>
      <form id="charForm">
        <div class="form-group">
          <label for="charName">캐릭터 이름 *</label>
          <input type="text" id="charName" required placeholder="예: 모몽가, 밤토리 등" />
        </div>
        <div class="form-group">
          <label for="charTitle">별명 / 타이틀 *</label>
          <input type="text" id="charTitle" required placeholder="예: 귀여운 척의 달인" />
        </div>
        <div class="form-group">
          <label for="charBio">캐릭터 소개 *</label>
          <textarea id="charBio" rows="2" required placeholder="캐릭터의 특징이나 매력을 적어주세요."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="charColor">테마 컬러</label>
            <input type="color" id="charColor" value="#5b9bd5" />
          </div>
          <div class="form-group">
            <label for="charPreset">기본 일러스트 스타일</label>
            <select id="charPreset">
              <option value="catBlue">파란 투톤 고양이형</option>
              <option value="bearWhite">하얀 곰돌이형</option>
              <option value="rabbitYellow">노란 토끼형</option>
              <option value="squirrelPurple">보라 하늘다람쥐형</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" data-close="charModal">취소</button>
          <button type="submit" class="btn btn-primary">캐릭터 등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 모달 2: 선택 캐릭터의 새로운 모습(Variant) 카드 추가 -->
  <div id="variantModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3><span id="targetCharName">캐릭터</span>의 새로운 모습 카드 추가</h3>
        <button class="close-btn" data-close="variantModal">&times;</button>
      </div>
      <form id="variantForm">
        <div class="form-group">
          <label for="variantTitle">모습 제목 *</label>
          <input type="text" id="variantTitle" required placeholder="예: 기타 치며 노래하는 모습, 파자마 파티 등" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="variantTag">카테고리 태그</label>
            <select id="variantTag">
              <option value="일상">일상</option>
              <option value="스페셜">스페셜</option>
              <option value="토벌/액션">토벌/액션</option>
              <option value="먹방">먹방</option>
            </select>
          </div>
          <div class="form-group">
            <label for="variantMood">표정/소품 프리셋 (URL 없을 시 적용)</label>
            <select id="variantMood">
              <option value="happy">활짝 웃는 모습</option>
              <option value="sing">기타 치며 노래하는 모습</option>
              <option value="battle">무기 들고 용감한 모습</option>
              <option value="food">맛있게 먹는 모습</option>
              <option value="sleep">파자마 입고 졸린 모습</option>
              <option value="cry">눈물 글썽이는 모습</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="variantImgUrl">외부 이미지 URL (선택사항 - 비워두면 위 프리셋 일러스트가 생성됩니다)</label>
          <input type="url" id="variantImgUrl" placeholder="https://example.com/image.jpg" />
        </div>
        <div class="form-group">
          <label for="variantQuote">카드 뒷면 명대사 / 한줄 메모 *</label>
          <input type="text" id="variantQuote" required placeholder="예: 어떻게든 되겠지~!" />
        </div>
        <div class="form-group">
          <label for="variantDesc">카드 뒷면 상세 설명 *</label>
          <textarea id="variantDesc" rows="2" required placeholder="이 모습에 담긴 에피소드나 설명을 적어주세요."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" data-close="variantModal">취소</button>
          <button type="submit" class="btn btn-accent">모습 카드 추가</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
